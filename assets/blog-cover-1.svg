<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3F"/>
      <stop offset="100%" stop-color="#15366A"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D6FE8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Graphic Elements: Browser Window Illustration -->
  <rect x="240" y="80" width="480" height="290" rx="16" fill="#FFFFFF" opacity="0.96"/>
  <rect x="240" y="80" width="480" height="40" rx="16" fill="#F3F6FA"/>
  <rect x="240" y="104" width="480" height="16" fill="#F3F6FA"/>
  <circle cx="264" cy="100" r="5" fill="#EF4444"/>
  <circle cx="280" cy="100" r="5" fill="#F59E0B"/>
  <circle cx="296" cy="100" r="5" fill="#10B981"/>
  
  <!-- Browser content bars -->
  <rect x="320" y="93" width="180" height="14" rx="7" fill="#E2E8F0"/>
  <rect x="270" y="145" width="220" height="20" rx="4" fill="#0B1F3F"/>
  <rect x="270" y="175" width="380" height="10" rx="3" fill="#94A3B8"/>
  <rect x="270" y="195" width="340" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="270" y="225" width="120" height="32" rx="16" fill="url(#blueGlow)"/>
  
  <!-- Mini cards in browser -->
  <rect x="270" y="275" width="125" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="410" y="275" width="125" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="550" y="275" width="145" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Left Accent Badge -->
  <rect x="60" y="150" width="160" height="160" rx="20" fill="#1D6FE8" opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M120 200 L160 200 M140 180 L140 220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="140" cy="200" r="32" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="75" y="290" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">STRATEGI BISNIS</text>
</svg>

