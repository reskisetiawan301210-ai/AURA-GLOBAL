<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B"/>
      <stop offset="100%" stop-color="#0F2A5C"/>
    </linearGradient>
    <linearGradient id="speedGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Subtle grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Smartphone Mockup Illustration -->
  <rect x="310" y="55" width="180" height="340" rx="28" fill="#FFFFFF" stroke="#334155" stroke-width="6"/>
  <!-- Phone speaker & camera notch -->
  <rect x="365" y="70" width="70" height="8" rx="4" fill="#0F172A"/>
  
  <!-- Screen content -->
  <rect x="325" y="90" width="150" height="280" rx="12" fill="#F8FAFC"/>
  <!-- App bar -->
  <rect x="335" y="105" width="130" height="24" rx="6" fill="#0B1F3F"/>
  <!-- Speedometer / Performance score badge -->
  <circle cx="400" cy="180" r="42" fill="none" stroke="#E2E8F0" stroke-width="8"/>
  <circle cx="400" cy="180" r="42" fill="none" stroke="url(#speedGlow)" stroke-width="8" stroke-dasharray="210 264" stroke-linecap="round"/>
  <text x="400" y="188" text-anchor="middle" fill="#0B1F3F" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">99</text>
  <text x="400" y="202" text-anchor="middle" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">OPTIMAL</text>

  <!-- Content cards in screen -->
  <rect x="335" y="240" width="130" height="35" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="335" y="285" width="130" height="35" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Left Speed Indicator -->
  <rect x="80" y="150" width="170" height="150" rx="20" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="1.5"/>
  <path d="M165 180 L140 225 L160 225 L145 270 L190 215 L170 215 Z" fill="#10B981"/>
  <text x="165" y="285" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1">PERFORMA KILAT</text>

  <!-- Right Metrics Card -->
  <rect x="550" y="150" width="170" height="150" rx="20" fill="#1D6FE8" opacity="0.12" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="635" y="195" text-anchor="middle" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">&lt; 1.5s</text>
  <text x="635" y="225" text-anchor="middle" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Waktu Muat HP</text>
  <text x="635" y="270" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">MOBILE OPTIMIZED</text>
</svg>

